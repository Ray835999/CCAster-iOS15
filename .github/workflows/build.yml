name: Build CCAster (iOS 15 port)

on:
  workflow_dispatch:
    inputs:
      sdk:
        description: 'iPhoneOS SDK version to build against'
        required: false
        default: '16.5'
  push:
    branches: [ main, master ]

# iOS tweak 编译不需要 macOS；用 ubuntu runner 避免 macOS 排队（新/免费账号常无限排队）
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fakeroot dpkg-dev git curl xz-utils \
            build-essential libplist-dev libssl-dev
          # Theos 的 Linux 工具链 clang 可能需要 libtinfo.so.5；24.04 只有 .6，做兼容软链
          if [ ! -e /usr/lib/x86_64-linux-gnu/libtinfo.so.5 ]; then
            sudo ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5 || true
          fi
          # 编译 ldid（Linux 上给 iOS 二进制签名，Theos 打包必需）
          git clone --recursive --depth 1 https://github.com/ProcursusTeam/ldid.git /tmp/ldid
          cd /tmp/ldid
          make
          sudo cp ldid /usr/local/bin/
          command -v ldid && echo "ldid ready"

      - name: Install Theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"

      - name: Install iPhoneOS SDK
        run: |
          mkdir -p "$HOME/theos/sdks"
          SDK="${{ github.event.inputs.sdk || '16.5' }}"
          curl -fsSL -o /tmp/sdk.tar.xz \
            "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS${SDK}.sdk.tar.xz"
          tar -xf /tmp/sdk.tar.xz -C "$HOME/theos/sdks"

      - name: Build package
        env:
          THEOS: ${{ github.workspace }}/../theos
        run: |
          export THEOS="$HOME/theos"
          export PATH="$THEOS/bin:$PATH"
          make clean package FINALPACKAGE=1

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: CCAster-iOS15
          path: packages/*.deb
